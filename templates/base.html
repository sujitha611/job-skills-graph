<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Job Skills Graph{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
  <a href="{{ url_for('home') }}" class="brand">
    <span class="brand-node"></span>
    <span>Job Skills Graph</span>
  </a>
  <nav>
    <a href="{{ url_for('home') }}">Explore</a>
    <a href="{{ url_for('almost_there') }}">Almost There</a>
  </nav>
</header>

<main class="container">
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flash">{{ messages[0] }}</div>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>

<footer class="foot">
  <span>Backed by CognoDB &mdash; a graph database.</span>
</footer>
</body>
</html>
